[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamkit"
version = "0.1.0"
description = "G4beamline production front end over the Mu2e prodtools g4bl runner, with an MCP server"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["beamkit", "beamkit.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
