[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamkit"
version = "0.5.0"
description = "G4beamline production front end over the Mu2e prodtools g4bl runner, with an MCP server"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3", "requests", "authlib", "tomli; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
beamkit-mcp = "beamkit.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["beamkit", "beamkit.*"]

[tool.setuptools.package-data]
beamkit = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
